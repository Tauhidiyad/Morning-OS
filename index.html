<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning OS — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #fdfaf4;
    --ink: #1a1410;
    --accent: #c0392b;
    --accent2: #2c5f2e;
    --muted: #8a7f72;
    --line: #d8d0c4;
    --shadow: rgba(26,20,16,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 27px,
        rgba(180,160,140,0.12) 27px,
        rgba(180,160,140,0.12) 28px
      );
  }

  .login-wrap {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .login-card {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 2px;
    width: 100%;
    padding: 44px 32px 40px;
    box-shadow: 0 4px 32px var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .login-corner {
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--line);
  }

  .login-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
    width: 100%;
  }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .login-tagline {
    font-family: 'DM Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
    text-align: center;
  }

  .login-divider {
    width: 36px;
    height: 1.5px;
    background: var(--line);
    margin: 0 auto 28px;
  }

  .login-prompt {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.7;
  }

  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .google-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 14px var(--shadow);
    background: #fff;
  }

  .google-btn:active { transform: translateY(1px); }

  .google-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .login-footnote {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--line);
    text-align: center;
    margin-top: 22px;
    text-transform: uppercase;
  }

  .login-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--line);
    text-align: center;
  }

  .error-msg {
    display: none;
    width: 100%;
    margin-top: 14px;
    padding: 10px 14px;
    background: #fdf0ee;
    border: 1px solid #e8b4ae;
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--accent);
    text-align: center;
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <span class="login-title">Morning OS</span>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" style="display:inline-block;vertical-align:middle;margin-left:2px;margin-bottom:-3px;flex-shrink:0;">
        <polygon points="13,3 25,23 1,23" fill="var(--accent)"/>
      </svg>
    </div>

    <div class="login-tagline">Your Personal Operating System</div>
    <div class="login-divider"></div>

    <p class="login-prompt">
      This is a private space<br>
      Sign in to access your data
    </p>

    <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
      <div class="spinner" id="spinner"></div>
      <svg id="googleIcon" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <p class="login-footnote" style="margin-top:24px; color: var(--muted);">Private by default</p>

  </div>

  <div class="login-date" id="dateStamp"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const ALLOWED_EMAIL = "Tauhidiyad@gmail.com";
  const MAIN_PAGE     = "https://tauhidiyad.github.io/Morning-OS/Morning-Os_Firebase_Final.html";

  const firebaseConfig = {
    apiKey: "AIzaSyBut2P7iYJM9WNJyTLY7VlRyc-B9ScKOlk",
    authDomain: "morning-os07.firebaseapp.com",
    projectId: "morning-os07",
    storageBucket: "morning-os07.firebasestorage.app",
    messagingSenderId: "18588008686",
    appId: "1:18588008686:web:3eb85280a72b56feee33ff"
  };

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  // If already signed in as the right person, go straight to app
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email.toLowerCase() === ALLOWED_EMAIL.toLowerCase()) {
        window.location.replace(MAIN_PAGE);
      } else {
        signOut(auth);
        showError("Access denied. This app is private.");
      }
    }
  });

  window.signInWithGoogle = async function () {
    const btn     = document.getElementById("googleBtn");
    const spinner = document.getElementById("spinner");
    const icon    = document.getElementById("googleIcon");

    btn.disabled          = true;
    spinner.style.display = "block";
    icon.style.display    = "none";

    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged above will handle the redirect
    } catch (err) {
      showError("Sign-in failed or cancelled. Try again.");
      console.error(err);
      btn.disabled          = false;
      spinner.style.display = "none";
      icon.style.display    = "block";
    }
  };

  function showError(msg) {
    const errBox = document.getElementById("errorMsg");
    errBox.textContent   = msg;
    errBox.style.display = "block";
  }
</script>

<script>
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dateStamp').textContent =
    `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
</script>

</body>
</html>
